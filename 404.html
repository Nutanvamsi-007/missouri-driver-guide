<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | Missouri Driver Guide</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
  <link rel="shortcut icon" href="favicon.ico" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .notfound-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
      background: radial-gradient(circle at 50% 20%, rgba(2, 132, 199, 0.15), transparent 70%), var(--bg-main);
    }
    .notfound-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 3rem 2.5rem;
      max-width: 580px;
      width: 100%;
      box-shadow: var(--shadow-lg);
      backdrop-filter: blur(12px);
    }
    .notfound-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 80px;
      height: 80px;
      border-radius: 24px;
      background: rgba(239, 68, 68, 0.15);
      border: 2px solid var(--mo-red);
      font-size: 2.5rem;
      margin-bottom: 1.5rem;
    }
    .notfound-title {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 0.75rem;
    }
    .notfound-desc {
      color: var(--text-secondary);
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .notfound-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div class="notfound-container">
    <div class="notfound-card">
      <div class="notfound-badge">🛑</div>
      <h1 class="notfound-title">Wrong Way / 404</h1>
      <p class="notfound-desc">
        The road you're looking for doesn't exist or has been relocated. Head back to the main portal to study chapters, take practice exams, or inspect road signs.
      </p>
      <div class="notfound-actions">
        <a href="index.html" class="btn-primary" style="text-decoration:none; display:inline-flex; align-items:center; gap:0.5rem;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
          Study Portal Home
        </a>
        <a href="index.html#exam" class="btn-secondary" style="text-decoration:none; display:inline-flex; align-items:center; gap:0.5rem;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
          Permit Exam Simulator
        </a>
      </div>
    </div>
  </div>

  <script>
    // If user arrived via hash or relative path, redirect smoothly after 4 seconds
    setTimeout(() => {
      if (window.location.pathname.endsWith('404.html')) {
        window.location.href = 'index.html';
      }
    }, 4000);
  </script>
</body>
</html>
